# Cash flow cell: one of the ten finance services split from the retired finance_* tables (2026-10-12).
# Expected inflow, outflow and reserve per period.
# Amounts are real (float) like every kit cell; cross-cell ids (account_id, ...) are plain bigints, not foreign keys.
cell: cash-flow
title: Cash flow
resources:
  cashflow-plan:
    table: cashflow_plans
    filters:
    - owner_scope
    - status
    ranges:
    - [period_start, period_end]
    fields:
      name:
        type: text
        required: true
        max_length: 200
      owner_scope:
        type: enum
        values:
        - personal
        - solo_empire
        - venture
        - client
        - shared
        default: solo_empire
      period_start:
        type: date
        required: true
      period_end:
        type: date
        required: true
      expected_inflow:
        type: real
        min: 0
        default: 0
      expected_outflow:
        type: real
        min: 0
        default: 0
      reserve_target:
        type: real
        min: 0
      currency:
        type: text
        default: THB
        max_length: 12
      status:
        type: enum
        values:
        - draft
        - active
        - closed
        - cancelled
        default: draft
      notes:
        type: text
