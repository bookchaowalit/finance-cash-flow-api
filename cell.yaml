# Cash flow cell: one of the ten finance services split from the retired finance_* tables (2026-10-12).
# Expected inflow, outflow and reserve per period.
# Amounts are exact (money = numeric(19,4), decimal = numeric(30,10); SPEC-003); cross-cell ids (account_id, ...) are plain bigints, not foreign keys.
cell: cash-flow
title: Cash flow
resources:
  cashflow-plan:
    # SPEC-005: reference data only in events (no amounts, names or notes).
    graph: [scope, period_start, period_end, currency, status]
    legacy_columns:
      scope: owner_scope
    table: cashflow_plans
    filters:
    - scope
    - status
    ranges:
    - [period_start, period_end]
    fields:
      name:
        type: text
        required: true
        max_length: 200
      scope:
        type: text
        max_length: 64
        default: ''
      period_start:
        type: date
        required: true
      period_end:
        type: date
        required: true
      expected_inflow:
        type: money
        min: 0
        default: 0
      expected_outflow:
        type: money
        min: 0
        default: 0
      reserve_target:
        type: money
        min: 0
      currency:
        type: currency
        default: THB
      status:
        type: enum
        values:
        - draft
        - active
        - closed
        - cancelled
        default: draft
      notes:
        type: text
